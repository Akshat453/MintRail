  - path: "api/src/signing.ts"
    level: high
  - path: "api/src/schema/payments.ts"
    level: high
  - path: "api/src/schema/payouts.ts"
    level: high
  - path: "api/src/schema/refunds.ts"
    level: high
  - path: "api/src/schema/settlements.ts"
    level: high
  - path: "api/src/services/payments.ts"
    level: high
  - path: "api/src/services/payouts.ts"
    level: high
  - path: "api/src/services/refunds.ts"
    level: high
  - path: "api/src/services/settlements.ts"
    level: high
  - path: "dashboard/app/(app)/payments/**"
    level: high
  - path: "dashboard/app/(app)/payouts/**"
    level: high
  - path: "dashboard/app/(app)/refunds/**"
    level: high
  - path: "dashboard/app/(app)/settlements/**"
    level: high
  - path: "dashboard/app/(app)/webhooks/**"
    level: high
  - path: "docs/legacy/alembic/**"
